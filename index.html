/* V2: referência visual local do site candidata-cloudflare-20261103.
   Sem fontes remotas: Georgia/Arial são substitutos locais do Cormorant/Jost. */
:root{--accent:#0a7f7b;--ink:#24221f;--muted:#67635b;--line:#e8e2d8}
body,button,input,select{font-family:Arial,"Helvetica Neue",sans-serif}
h1,h2,.stat strong,.finance-total strong{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.02em}
h1{font-size:clamp(34px,4vw,46px)}
h2{font-size:25px}
small,.muted,.page-head p,.panel-head p{color:#67635b}
.demo-banner strong{color:#bde5e1}
.sidebar{width:262px}
.brand{display:block;padding:0 11px 36px}
.brand img{display:block;width:100%;height:auto;max-height:70px;object-fit:contain;object-position:left center}
.brand small{font-family:Arial,sans-serif;color:#67635b;font-size:11px;letter-spacing:.035em;margin-top:12px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.topbar-brand img{width:145px;height:auto;display:block}
.nav-btn.active{box-shadow:inset 3px 0 0 var(--accent)}
.nav-btn:hover{background:#eaf5f3}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#066562}
.hero:after{content:"";border:1px solid #a9d4ce;border-radius:50%;width:240px;height:240px;right:-45px;top:-105px}
.hero h2{color:var(--ink)}
.hero p{color:#475f5c}
.hero .hero-art{color:#075d5a;border-color:#a9d4ce;background:#f2f9f7}
.agent-card h2{color:#fff}
.agent-card p{color:#d8eae7}
.agent-card .eyebrow{color:#bde5e1}
.content-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:18px}
.content-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0;box-shadow:0 10px 24px #24221f08}
.content-art{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:200px;padding:22px 24px;color:#24221f;background:linear-gradient(130deg,#eaf5f3,#f6f3ed 75%);border-radius:9px;overflow:hidden}
.content-art:after{content:"";position:absolute;width:240px;height:240px;border:1px solid #9dcac5;border-radius:50%;right:-95px;top:-95px;pointer-events:none}
.content-art-index,.content-art-footer{position:relative;z-index:1;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#075d5a;font-weight:700}
.content-art-title{position:relative;z-index:1;display:block;max-width:72%;font:32px/1.05 Georgia,serif;letter-spacing:-.03em}
.content-art-footer{text-transform:none;letter-spacing:.02em}
.content-copy{padding:19px 12px 12px}
.content-format{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:700;margin-bottom:6px}
.content-copy h2{margin-bottom:14px}
.content-status{display:inline-block;border-radius:50px;padding:6px 12px;font-size:11px;font-weight:700;line-height:1.4}
.content-status.delivered{background:#eaf5f3;color:#075d5a}
.content-status.pending{background:#f8f0df;color:#785b24}
.content-copy p,.content-disclaimer{color:var(--muted);font-size:12px;line-height:1.6;margin-top:13px}
.content-disclaimer{margin-top:0}
@media(max-width:1000px){.sidebar{width:220px}}
@media(max-width:700px){
 .topbar-brand{display:block}
 .topbar{gap:8px}
 .topbar-brand img{width:135px;max-width:38vw}
 .offline-pill{white-space:nowrap;padding:5px 7px;font-size:9px}
 .bottom-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(48px,auto);justify-content:stretch;padding:4px 5px calc(4px + env(safe-area-inset-bottom))}
 .bottom-nav .nav-btn{width:100%;min-height:46px;gap:0;padding:3px 2px;font-size:10px}
 .bottom-nav .nav-icon{font-size:16px;line-height:1.1}
 main{padding-bottom:135px}
 .content-cards{grid-template-columns:1fr}
 .content-art{min-height:180px}
}
